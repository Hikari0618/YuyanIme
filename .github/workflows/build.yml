name: Build and Release YuyanIme APK
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Check engine library
        run: |
          if [ ! -f yuyansdk/libs/arm64-v8a/libyuyanime.so ]; then
            echo "❌ 缺少 yuyansdk/libs/arm64-v8a/libyuyanime.so（新 Rime 核心）"
            exit 1
          fi
          ls -lh yuyansdk/libs/arm64-v8a/libyuyanime.so

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          ls -lh keystore/release.jks
          # 验证 keystore 可读且 alias 正确
          keytool -list -keystore keystore/release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" -alias yuyan || \
            { echo "❌ Keystore 验证失败：alias 'yuyan' 不存在或密码错误"; exit 1; }
          echo "✅ Keystore 验证通过"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleOfflineRelease
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: yuyan
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Debug APK
        run: ./gradlew assembleOfflineDebug
        if: always()
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: yuyan
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yuyanIme-apks
          path: |
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/offline/debug/*.apk

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/offline/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
