name: Build and Release YuyanIme APK
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Compile librime_sync.so
        run: |
          NDK_TOOLCHAIN=$(find /usr/local/lib/android/sdk/ndk -path "*/linux-x86_64/bin/aarch64-linux-android*-clang" 2>/dev/null | head -1)
          if [ -z "$NDK_TOOLCHAIN" ]; then
            NDK_TOOLCHAIN=$(find $ANDROID_NDK_HOME -path "*/linux-x86_64/bin/aarch64-linux-android*-clang" 2>/dev/null | head -1)
          fi
          if [ -z "$NDK_TOOLCHAIN" ]; then
            echo "⚠️ NDK not found, skipping"
            exit 0
          fi
          CC_DIR=$(dirname "$NDK_TOOLCHAIN")
          JNI_SRC="yuyansdk/src/main/jni/rime_sync_jni.c"
          if [ ! -f "$JNI_SRC" ]; then
            echo "⚠️ rime_sync_jni.c not found, skipping"
            exit 0
          fi
          for arch in arm64-v8a armeabi-v7a x86 x86_64; do
            case $arch in
              arm64-v8a)   CC="$CC_DIR/aarch64-linux-android24-clang" ;;
              armeabi-v7a) CC="$CC_DIR/armv7a-linux-androideabi24-clang" ;;
              x86)         CC="$CC_DIR/i686-linux-android24-clang" ;;
              x86_64)      CC="$CC_DIR/x86_64-linux-android24-clang" ;;
            esac
            $CC -shared -o "yuyansdk/libs/$arch/librime_sync.so" "$JNI_SRC" -ldl
            echo "✅ librime_sync.so for $arch"
          done

      - name: Download language model (.gram)
        run: |
          echo "📦 Downloading wanxiang grammar model..."
          wget -q "https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram" \
            -O yuyansdk/src/main/assets/rime/wanxiang-lts-zh-hans.gram
          ls -lh yuyansdk/src/main/assets/rime/wanxiang-lts-zh-hans.gram

      - name: Decode keystore
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          ls -lh keystore/release.jks
          # 验证 keystore 可读且 alias 正确
          keytool -list -keystore keystore/release.jks \
            -storepass "$RELEASE_STORE_PASSWORD" -alias yuyan || \
            { echo "❌ Keystore 验证失败：alias 'yuyan' 不存在或密码错误"; exit 1; }
          echo "✅ Keystore 验证通过"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleOfflineRelease
        env:
          RELEASE_STORE_FILE: keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: yuyan
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Build Debug APK
        run: ./gradlew assembleOfflineDebug
        if: always()

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yuyanIme-apks
          path: |
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/offline/debug/*.apk

      - name: Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/offline/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
