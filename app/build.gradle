plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 36
    namespace 'com.yuyan'
    defaultConfig {
        applicationId "com.yuyan.pinyin"
        minSdk 23
        targetSdk 36
        versionCode Integer.valueOf(versionCodeDate())
        versionName versionNameDate()

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk {
            abiFilters 'arm64-v8a'
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [AROUTER_MODULE_NAME: project.getName()]
            }
        }
    }

    // 改动6：lintOptions 原先写在 defaultConfig 里，AGP 8 会忽略这种旧写法。
    // 必须移到 android {} 顶层并改用新的 lint {} DSL，abortOnError 才会真正生效。
    lint {
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            // 非压缩打包（现代做法）：.so 直接从 APK mmap，不再安装时解压。
            // 依赖 AGP 8.5.1+ 自动把未压缩的 .so 在 zip 内对齐到 16 KB，
            // 否则 16KB 页设备上会加载失败（见 build.gradle 里 AGP 版本）。
            useLegacyPackaging false
        }
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore/keystore.properties")
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            def keystoreFilePath = System.getenv("RELEASE_STORE_FILE") ?: keystoreProperties.getProperty('storeFile') ?: "keystore/release.jks"
            def keystorePassword = System.getenv("RELEASE_STORE_PASSWORD") ?: keystoreProperties.getProperty('storePassword') ?: "yuyan123"
            def keyAliasName = System.getenv("RELEASE_KEY_ALIAS") ?: keystoreProperties.getProperty('keyAlias') ?: "yuyan"
            def keyPasswordValue = System.getenv("RELEASE_KEY_PASSWORD") ?: keystoreProperties.getProperty('keyPassword') ?: "yuyan123"
            def keystoreFile = rootProject.file(keystoreFilePath)
            storeFile keystoreFile
            storePassword keystorePassword
            keyAlias keyAliasName
            keyPassword keyPasswordValue
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    //多渠道打包
    flavorDimensions = ["default"]
    productFlavors {
        offline {
            dimension "default"
            applicationIdSuffix  ".offline"
        }
    }

    buildTypes {
        release {
            // 混淆
            minifyEnabled true
            shrinkResources true
            applicationIdSuffix  ".release"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard.cfg'
            signingConfig signingConfigs.release
        }

        debug {
            applicationIdSuffix ".debug"
            // 改动5：debug 变体不再复用 release 签名。否则 debug 包与 release 同签名身份，
            // 既污染 release 签名一致性，又导致两者无法在同一设备共存升级。
            // 改为使用默认 debug 签名，仅 release 使用 signingConfigs.release。
        }

    }
    //    第三方库使用java1.8
    compileOptions {
        sourceCompatibility 17
        targetCompatibility 17
    }
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "yuyanIme_${versionCodeDate()}_${variant.buildType.name}.apk"
        }
    }
}

static def versionCodeDate() {
    // 改动8：原为 yyyyMMddHH（10 位，如 2148010100），到 2148 年会超过 INT_MAX，
    // 使 Integer.valueOf 抛异常；且同一小时内多次构建 versionCode 相同。
    // 改用 yyyyMMdd（8 位，如 20261010，远小于 INT_MAX），按天单调递增，
    // 同一小时内不再重复。outputFileName 复用本函数，命名仍然合法。
    return new Date().format("yyyyMMdd", TimeZone.getTimeZone("GMT+8"))
}

static def versionNameDate() {
    return new Date().format("yyyyMMdd.HH", TimeZone.getTimeZone("GMT+8"))
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':yuyansdk')
}
